name: Release

on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================================================
  # WINDOWS: x86_64 (.exe installer + .zip)
  # ===========================================================================
  build-windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version tag
        id: vars
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Sync Cargo.toml version with Git tag
        shell: bash
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          echo "Syncing all Cargo.toml packages to Git tag version: ${VERSION}"
          if [ -n "$VERSION" ]; then
            for f in crates/*/Cargo.toml; do
              sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" "$f"
              rm -f "${f}.bak"
            done
          fi

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          cache: true

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc -p harfiy-daemon

      - name: Build Windows Installers (.exe & .zip)
        shell: pwsh
        run: |
          $ver = "${{ steps.vars.outputs.version }}"
          $tag = "${{ steps.vars.outputs.tag }}"
          $target = "x86_64-pc-windows-msvc"
          $distDir = "dist"
          New-Item -ItemType Directory -Force -Path $distDir
          
          # 1. Build Inno Setup .exe installer
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
              Write-Host "Compiling Inno Setup installer..."
              $binDir = (Resolve-Path "target\$target\release").Path
              $outDir = (Resolve-Path $distDir).Path
              & $iscc "/DMyAppVersion=$ver" "/DMyBinaryDir=$binDir" "/DMyOutputDir=$outDir" "packaging\windows\harfiy.iss"
              if ($LASTEXITCODE -ne 0) {
                  Write-Error "Inno Setup compilation failed with code $LASTEXITCODE"
                  exit $LASTEXITCODE
              }
          } else {
              Write-Error "Inno Setup not found at $iscc"
              exit 1
          }
          
          # 2. Build portable .zip
          $pkgName = "harfiy-$tag-$target"
          $pkgDir = New-Item -ItemType Directory -Path $pkgName
          Copy-Item "target/$target/release/harfiy.exe" -Destination $pkgDir/
          Copy-Item "README.md" -Destination $pkgDir/
          if (Test-Path "assets") { Copy-Item -Recurse "assets" -Destination $pkgDir/ }
          Compress-Archive -Path "$pkgName/*" -DestinationPath "$distDir/$pkgName.zip"
          Remove-Item -Recurse -Force $pkgName

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/*
          if-no-files-found: error

  # ===========================================================================
  # LINUX: Ubuntu x86_64 (.deb package + .tar.gz)
  # ===========================================================================
  build-linux:
    name: Linux (Ubuntu x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version tag
        id: vars
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Sync Cargo.toml version with Git tag
        shell: bash
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          echo "Syncing all Cargo.toml packages to Git tag version: ${VERSION}"
          if [ -n "$VERSION" ]; then
            for f in crates/*/Cargo.toml; do
              sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" "$f"
              rm -f "${f}.bak"
            done
          fi

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libx11-dev

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
          cache: true

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu -p harfiy-daemon

      - name: Build Linux Installers (.deb & .tar.gz)
        shell: bash
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          TAG="${{ steps.vars.outputs.tag }}"
          TARGET="x86_64-unknown-linux-gnu"
          DIST_DIR="dist"
          mkdir -p "$DIST_DIR"
          
          # 1. Build .deb package
          chmod +x packaging/linux/build_deb.sh
          ./packaging/linux/build_deb.sh "$VERSION" "target/${TARGET}/release" "$DIST_DIR"
          
          # 2. Build portable .tar.gz
          PKG_NAME="harfiy-${TAG}-${TARGET}"
          mkdir -p "${PKG_NAME}"
          cp "target/${TARGET}/release/harfiy" "${PKG_NAME}/"
          cp "README.md" "${PKG_NAME}/"
          if [ -d "assets" ]; then cp -r "assets" "${PKG_NAME}/"; fi
          tar -czvf "${DIST_DIR}/${PKG_NAME}.tar.gz" -C "${PKG_NAME}" .
          rm -rf "${PKG_NAME}"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: dist/*
          if-no-files-found: error

  # ===========================================================================
  # MACOS: Intel & Apple Silicon (.dmg installer + .tar.gz)
  # ===========================================================================
  build-macos:
    name: macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: x86_64
          - target: aarch64-apple-darwin
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version tag
        id: vars
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Sync Cargo.toml version with Git tag
        shell: bash
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          echo "Syncing all Cargo.toml packages to Git tag version: ${VERSION}"
          if [ -n "$VERSION" ]; then
            for f in crates/*/Cargo.toml; do
              sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" "$f"
              rm -f "${f}.bak"
            done
          fi

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: true

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p harfiy-daemon

      - name: Build macOS Installers (.dmg & .tar.gz)
        shell: bash
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          TAG="${{ steps.vars.outputs.tag }}"
          TARGET="${{ matrix.target }}"
          DIST_DIR="dist"
          mkdir -p "$DIST_DIR"
          
          # 1. Build .dmg and .pkg installer wizard
          chmod +x packaging/macos/build_dmg.sh packaging/macos/build_pkg.sh
          ./packaging/macos/build_dmg.sh "$VERSION" "target/${TARGET}/release" "$DIST_DIR" "${{ matrix.arch }}"
          
          # 2. Build portable .tar.gz
          PKG_NAME="harfiy-${TAG}-${TARGET}"
          mkdir -p "${PKG_NAME}"
          cp "target/${TARGET}/release/harfiy" "${PKG_NAME}/"
          cp "README.md" "${PKG_NAME}/"
          if [ -d "assets" ]; then cp -r "assets" "${PKG_NAME}/"; fi
          tar -czvf "${DIST_DIR}/${PKG_NAME}.tar.gz" -C "${PKG_NAME}" .
          rm -rf "${PKG_NAME}"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # ===========================================================================
  # PUBLISH RELEASE: Collect all artifacts & publish to GitHub Releases
  # ===========================================================================
  publish-release:
    name: Publish Release to GitHub
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version tag
        id: vars
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-installers

      - name: Assemble final release files and master checksums
        run: |
          mkdir -p release-assets
          find downloaded-installers -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.pkg" -o -name "*.deb" -o -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release-assets/ \;
          
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Harfiy ${{ steps.vars.outputs.tag }}"
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false

  # ===========================================================================
  # WINGET: Publish Windows package to Windows Package Manager Community Repo
  # ===========================================================================
  publish-winget:
    name: Publish to WinGet Community Repo
    needs: [publish-release]
    runs-on: windows-latest
    steps:
      - name: Determine version tag
        id: vars
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Publish to WinGet
        uses: vedantmgoyal9/winget-releaser@v2
        if: ${{ env.WINGET_TOKEN != '' }}
        continue-on-error: true
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        with:
          identifier: AbdumannonShamsiyev.Harfiy
          token: ${{ secrets.WINGET_TOKEN }}
          release-tag: ${{ steps.vars.outputs.tag }}
          installers-regex: '.*-windows-.*\.exe$'

