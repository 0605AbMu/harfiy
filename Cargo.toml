[workspace]
members = [
    "crates/engine",
    "crates/docs",
    "crates/platform",
    "crates/tray",
    "crates/daemon",
    "crates/ffi",
    "crates/wasm",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Size-optimised build for the iOS keyboard extension (tight memory limit; the
# engine is a tiny FSM, so speed is not a concern). Used by mobile/scripts/build_ios.sh.
[profile.ios]
inherits = "release"
opt-level = "s"
