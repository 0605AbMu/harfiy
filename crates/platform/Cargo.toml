[package]
name = "harfiy-platform"
version = "0.4.0"
edition = "2021"
authors = ["Abdumannon Shamsiyev"]
description = "OS-specific keyboard hook interceptors and synthetic event emitters for Harfiy"

[dependencies]
harfiy-engine = { path = "../engine" }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls_Dialogs",
    "Win32_System_Registry",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
