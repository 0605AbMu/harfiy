[package]
name = "harfiy-platform"
version = "1.2.0"
edition = "2021"
authors = ["Abdumannon Shamsiyev"]
description = "OS-specific keyboard hook interceptors and synthetic event emitters for Harfiy"
license = "MIT"
repository = "https://github.com/0605AbMu/harfiy"

[dependencies]
harfiy-engine = { path = "../engine" }
thiserror = "2"
log = { version = "0.4", features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls_Dialogs",
    "Win32_System_Registry",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_EventLog",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
core-graphics = "0.25.0"
directories = "5"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSWorkspace", "NSRunningApplication"] }

[dev-dependencies]
