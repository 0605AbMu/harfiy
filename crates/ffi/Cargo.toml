[package]
name = "harfiy-ffi"
version = "1.2.2"
edition = "2021"
authors = ["Abdumannon Shamsiyev"]
description = "C-ABI and JNI mobile bindings for Harfiy Engine (iOS & Android)"
license = "MIT"
repository = "https://github.com/0605AbMu/harfiy"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
harfiy-engine = { path = "../engine" }

# JNI is only needed for the Android build; keep it out of the iOS static library.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[dev-dependencies]
