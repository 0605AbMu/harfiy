[package]
name = "harfiy-wasm"
version = "1.2.0"
edition = "2021"
authors = ["Abdumannon Shamsiyev"]
description = "WebAssembly bindings for Harfiy Engine (Web & SPA)"
license = "MIT"
repository = "https://github.com/0605AbMu/harfiy"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
harfiy-engine = { path = "../engine" }
harfiy-docs = { path = "../docs" }
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

