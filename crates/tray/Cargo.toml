[package]
name = "harfiy-tray"
version = "0.7.0"
edition = "2021"
authors = ["Abdumannon Shamsiyev"]
description = "System tray and global hotkey management for Harfiy"

[dependencies]
harfiy-engine = { path = "../engine" }
tray-icon = "0.19"
global-hotkey = "0.6"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSDate", "NSAutoreleasePool", "NSThread"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSEvent", "NSMenu", "NSResponder"] }

